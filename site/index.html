<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Structure H1</title>
<style>
/* Layout: TradingView-like workspace. Top bar, chart on the left, right panel (plan / stats / trades / strategy). Stacks on phones. */
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --border: #e0e3eb;
  --hover: #f0f3fa;
  --text: #131722;
  --muted: #787b86;
  --accent: #2962ff;
  --accent-soft: rgba(41, 98, 255, .10);
  --up: #089981;
  --down: #f23645;
  --up-soft: rgba(8, 153, 129, .12);
  --down-soft: rgba(242, 54, 69, .12);
  --warn: #a15c00;
  --warn-soft: rgba(245, 166, 35, .18);
  --ft: #9c27b0;
  --grid: #f0f3fa;
  --font: -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif;
  --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"] {
  --bg: #131722; --panel: #131722; --border: #2a2e39; --hover: #2a2e39; --text: #d1d4dc; --muted: #787b86;
  --accent: #2962ff; --accent-soft: rgba(41, 98, 255, .18); --up: #089981; --down: #f23645;
  --up-soft: rgba(8, 153, 129, .18); --down-soft: rgba(242, 54, 69, .18); --warn: #f5a623; --warn-soft: rgba(245, 166, 35, .16);
  --ft: #ce93d8; --grid: #1e222d;
  color-scheme: dark;
}
:root { color-scheme: light; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); margin: 0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-width: 0; flex-wrap: wrap; }
.sym { position: relative; }
.sym-btn { display: flex; align-items: center; gap: 8px; background: none; border: 0; border-radius: 4px; padding: 6px 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.sym-btn:hover, .tool:hover { background: var(--hover); }
.sym-btn small { color: var(--muted); font-weight: 400; font-size: 13px; }
.sym-btn svg { width: 12px; height: 12px; fill: var(--muted); }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); min-width: 300px; max-width: calc(100vw - 24px); padding: 4px 0; }
.menu button { display: grid; grid-template-columns: 72px 1fr auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; cursor: pointer; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--hover); }
.menu button b { font-weight: 600; }
.menu button span { color: var(--muted); }
.menu button em { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; }
.menu button em.dl { color: var(--warn); font-size: 12px; }
.menu .menu-err { padding: 8px 12px; color: var(--muted); font-size: 12px; }
.brk { display: none; }
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
.tool { border: 0; background: none; border-radius: 4px; padding: 5px 8px; cursor: pointer; color: var(--text); }
.tool[aria-pressed="true"] { color: var(--accent); }
.tf { font-weight: 600; }
.px { margin-left: auto; display: flex; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
.px b { font-size: 15px; }
.px .meta { color: var(--muted); font-size: 12px; }
@keyframes fu { from { color: var(--up); } to { color: var(--text); } }
@keyframes fd { from { color: var(--down); } to { color: var(--text); } }
#lastPx.fu { animation: fu 1s ease-out; }
#lastPx.fd { animation: fd 1s ease-out; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--hover); color: var(--muted); white-space: nowrap; cursor: default; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.live { background: var(--up-soft); color: var(--up); }
.pill.lag { background: var(--warn-soft); color: var(--warn); }
button.modchip { border: 0; cursor: pointer; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 3px 8px; font-size: 12px; font-weight: 600; }

.bar { min-height: 46px; }
.pill { font-weight: 500; }
/* workspace */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
.chartwrap { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--border); }
#chart { position: absolute; inset: 36px 0 0 0; }
.legend { position: absolute; top: 44px; left: 12px; right: 70px; z-index: 5; display: flex; flex-direction: column; gap: 2px; pointer-events: none; font-variant-numeric: tabular-nums; }
.legend .l1 { font-size: 14px; }
.legend .l1 b { font-weight: 600; }
.legend .l2 { color: var(--muted); font-size: 12px; }
.legend .o { color: var(--muted); }
.legend .v.up { color: var(--up); } .legend .v.down { color: var(--down); }
.keys { position: absolute; bottom: 30px; left: 12px; z-index: 5; display: flex; gap: 2px 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); pointer-events: none; width: fit-content; max-width: calc(100% - 82px); padding: 3px 8px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 80%, transparent); }
.keys span { white-space: nowrap; }
.keys i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; margin-right: 5px; vertical-align: 3px; }
.keys i.dash { height: 0; background: none; border-top: 2px dashed var(--muted); border-radius: 0; }
.keys i.dot { height: 0; background: none; border-top: 2px dotted var(--warn); border-radius: 0; }
.keys i.bx { width: 12px; height: 8px; border-radius: 2px; border: 1px solid; vertical-align: -1px; }
.toast { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 7; max-width: calc(100% - 24px); display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 8px 12px; font-size: 12px; }
.toast button { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 2px 4px; }

/* chart toolbar (display toggles + backtest period) */
.chartbar { position: absolute; top: 0; left: 0; right: 0; height: 36px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.chartbar::-webkit-scrollbar { display: none; }
.grp { display: inline-flex; gap: 2px; flex: none; }
.grp .tool { padding: 3px 9px; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid transparent; }
.grp .tool[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.hz { display: inline-flex; gap: 2px; flex: none; }
.hz button { border: 0; background: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }
.hz button:hover { background: var(--hover); }
.hz button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.cb-l { color: var(--muted); font-size: 11px; flex: none; }
.tip { position: absolute; z-index: 8; pointer-events: none; max-width: min(420px, calc(100% - 12px)); background: var(--text); color: var(--bg); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-variant-numeric: tabular-nums; }
.tool.icon { padding: 5px 7px; display: inline-flex; align-items: center; }
.tool.icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* side panel */
.side { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 8px; }
.tabs button { border: 0; background: none; padding: 10px 10px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.pane { overflow: auto; min-height: 0; padding: 14px 16px 24px; }
.pane h3 { margin: 18px 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pane h3:first-child { margin-top: 0; }
.note { color: var(--muted); font-size: 12px; max-width: 62ch; margin: 6px 0; }
.note.warnc { color: var(--warn); }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.chip.neu { background: var(--hover); color: var(--muted); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-variant-numeric: tabular-nums; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; }
.box { border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.sim { background: var(--accent-soft); color: var(--text); border-radius: 6px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; }
.sim b { color: var(--accent); }

.btn { border: 1px solid var(--border); background: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 12px; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.pri:hover { filter: brightness(1.1); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.err { border: 1px solid var(--down); background: var(--down-soft); border-radius: 6px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.busy { color: var(--muted); display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.dim { opacity: .5; transition: opacity .15s; }

/* account + order tickets */
.acc-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.acc-grid label { display: grid; gap: 3px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; min-width: 0; }
input[type="number"], input[type="date"], select, input[type="text"] { width: 100%; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.acc-grid input, .acc-grid select { text-transform: none; letter-spacing: 0; font-size: 13px; }
.ord { border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: grid; gap: 10px; margin-bottom: 10px; }
.ord.off { opacity: .6; }
.ord-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ord-t { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.ord.buy .ord-t { color: var(--up); } .ord.sell .ord-t { color: var(--down); }
.ord-g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.ord-g div { display: grid; gap: 2px; min-width: 0; }
.ord-g span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.ord-g b { font-variant-numeric: tabular-nums; font-size: 14px; overflow-wrap: anywhere; }
.ord-g small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ord-g .e b { color: var(--accent); } .ord-g .s b { color: var(--down); } .ord-g .t b { color: var(--up); }
.ord ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
.ord .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.ord .note { margin: 0; }
.ord-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 10px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--text); font-weight: 600; }
.range { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; }
.range input { width: auto; flex: 1 1 120px; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.tile span { color: var(--muted); font-size: 11px; }
.tile b { font-size: 15px; font-variant-numeric: tabular-nums; }
.eq { height: 160px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; position: relative; }

.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stats th { text-align: right; color: var(--muted); font-weight: 400; font-size: 11px; padding: 0 0 6px 6px; }
.stats th:first-child { text-align: left; padding-left: 0; }
.stats td { text-align: right; padding: 8px 0 8px 6px; border-top: 1px solid var(--border); }
.stats td:first-child { text-align: left; padding-left: 0; }
.stats td:not(:first-child), .stats th:not(:first-child) { white-space: nowrap; }
.stats td small { display: block; color: var(--muted); font-size: 11px; }
.pos { color: var(--up); } .neg { color: var(--down); }

.years { display: grid; gap: 4px; font-variant-numeric: tabular-nums; font-size: 12px; }
.yr { display: grid; grid-template-columns: 52px 1fr 1fr 48px; gap: 8px; align-items: center; }
.yr.one { grid-template-columns: 52px 1fr 48px; }
.yr .y { color: var(--muted); white-space: nowrap; }
.yr .v { text-align: right; }
.barc { position: relative; height: 12px; }
.barc::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--border); }
.barc i { position: absolute; top: 2px; height: 8px; border-radius: 1px; }
.yrh { display: grid; grid-template-columns: 52px 1fr 1fr 48px; gap: 8px; color: var(--muted); font-size: 11px; text-align: center; }

.list { display: grid; }
.tr { display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 10px; padding: 9px 6px; border-top: 1px solid var(--border); cursor: pointer; border-radius: 4px; font-variant-numeric: tabular-nums; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.tr:hover, .tr[aria-current="true"] { background: var(--hover); }
.tr .k { font-weight: 600; }
.tr .k.ft { color: var(--ft); } .tr .k.epa { color: var(--accent); }
.tr .d { color: var(--muted); font-size: 12px; }
.tr .res { text-align: right; font-weight: 600; }
.tr .lv { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.filters button { border: 1px solid var(--border); background: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* strategy form */
.frm { display: grid; }
.fld { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 2px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
.fld:first-child { border-top: 0; }
.fld > .tx b { display: block; font-weight: 600; }
.fld > .tx small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }
.fld.full { grid-template-columns: minmax(0, 1fr); }
.fld.chk { grid-template-columns: 18px minmax(0, 1fr); align-items: start; gap: 2px 10px; cursor: pointer; }
.fld.chk input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); }
.fld .two { display: flex; gap: 6px; align-items: center; }
.fld .two input { min-width: 0; }
.fld .inl { display: flex; gap: 6px; align-items: center; }
.fld .inl input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.fld .inl output { min-width: 40px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.caution { margin-top: 14px; border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 12px; }
.dirty { color: var(--warn); font-size: 12px; font-weight: 600; margin-top: 8px; }
.ok { color: var(--up); font-size: 12px; font-weight: 600; margin-top: 8px; }
.ferr { color: var(--down); font-size: 12px; margin-top: 8px; }

.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 6; background: var(--bg); text-align: center; padding: 16px; }
.loading .ld { display: grid; gap: 10px; justify-items: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.menu button:focus-visible, .tr:focus-visible { outline-offset: -2px; }

.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.ph h2 { margin: 0; font-size: 15px; font-weight: 700; }
.ph .note { margin: 0; }
.pane { padding: 16px 18px 28px; }
.pane h3 { margin: 22px 0 8px; }
.ord { background: var(--panel); border-radius: 8px; box-shadow: 0 1px 3px rgba(19, 23, 34, .08); padding: 14px; }
.ord-t { font-size: 16px; }
.disc { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
.empty { border: 1px dashed var(--border); border-radius: 8px; padding: 18px 14px; text-align: center; color: var(--muted); display: grid; gap: 4px; justify-items: center; }
.empty b { color: var(--text); font-weight: 600; font-size: 13px; }
.empty svg { width: 26px; height: 26px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.accd { margin-top: 22px; border: 1px solid var(--border); border-radius: 8px; }
.accd summary { cursor: pointer; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; list-style: none; }
.accd summary::-webkit-details-marker { display: none; }
.accd summary::before { content: "▸"; color: var(--muted); margin-right: 6px; transition: transform .15s; display: inline-block; }
.accd[open] summary::before { transform: rotate(90deg); }
.accd summary > span:first-child { flex: 1; }
.accd .sum { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.accd .box { border: 0; border-top: 1px solid var(--border); border-radius: 0 0 8px 8px; }
.skel { display: grid; gap: 10px; margin: 6px 0; }
.skel i { display: block; height: 78px; border-radius: 8px; background: linear-gradient(90deg, var(--hover) 25%, var(--bg) 50%, var(--hover) 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.tabs button { padding: 11px 12px 10px; }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .work { grid-template-columns: 1fr; }
  .chartwrap { height: 440px; border-right: 0; border-bottom: 1px solid var(--border); }
  .side { min-height: 0; }
  .pane { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .px .meta { display: none; }
}
@media (max-width: 600px) {
  .cb-l, .chartbar .sep { display: none; }
  .hz button { padding: 3px 6px; }
  .keys { font-size: 10px; gap: 1px 8px; left: 8px; padding: 2px 6px; max-width: calc(100% - 70px); }
  .keys .opt { display: none; }
  .bar { gap: 6px 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar > * { order: 3; }
  .bar .sym { order: 0; } .bar .px { order: 1; margin-left: auto; } .bar #tTheme { order: 1; }
  .bar .brk { display: block; flex-basis: 100%; height: 0; order: 2; }
  .bar .sep { display: none; }
  .tabs { padding: 0 8px; overflow-x: auto; }
  .pane { padding: 14px 16px 24px; }
  .tabs button { padding: 10px 9px 9px; }
  .sym-btn { padding-left: 0; }
  .menu { min-width: 280px; }
}
@media (max-width: 420px) {
  .ord-g { grid-template-columns: repeat(2, 1fr); }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .acc-grid { grid-template-columns: 1fr 1fr; }
  .acc-grid label:first-child { grid-column: 1 / -1; }
  .fld { grid-template-columns: minmax(0, 1fr) 104px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
  #lastPx.fu, #lastPx.fd { animation: none; }

  sec = Math.max(0, Math.round(sec));

  if (sec < 3600) return 'il y a ' + Math.round(sec / 60) + ' min';
  if (sec < 86400) { const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return 'il y a ' + h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : ''); }

const hzLabel = () => S.hz === 'tout' ? 'tout l’historique' : S.hz === 'perso' ? 'dates choisies' : (HORIZONS.find((h) => h[0] === S.hz) || [0, S.hz])[1].replace(' ', ' ');
const keyOf = (tr) => [tr.k, tr.v, tr.d, tr.ti].join('|');

/* ---------- API ---------- */
class ApiError extends Error { constructor(msg, status, body) { super(msg); this.status = status; this.body = body; } }
async function api(path, opts = {}) {
  let r;
  try { r = await fetch('api/' + path, opts); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new ApiError('serveur injoignable', 0, null); }
  let body = null;
  try { body = await r.json(); } catch (e) { /* not json */ }
  if (!r.ok) {
    let msg = body && typeof body.detail === 'string' ? body.detail : (r.status === 503 ? 'données en cours de téléchargement' : r.status === 422 ? 'paramètres invalides' : 'erreur ' + r.status);
    throw new ApiError(msg, r.status, body);
  }

}
const post = (path, body, signal) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal });
function bootPct(id, body) {
  let p = body && typeof body.progress === 'number' ? body.progress : null;
  if (p == null) { const e = S.status && S.status.inst[id]; if (e && e.progress != null) p = e.progress; }
  return p;
}
const bootTxt = (p) => 'Téléchargement des données…' + (p != null ? ' ' + Math.round(p * 100) + ' %' : '');
function later(key, fn, ms) { clearTimeout(S.timers[key]); S.timers[key] = setTimeout(fn, ms); }

/* ---------- params / account ---------- */
function sanitizeParams(p) {
  const d = DEF_PARAMS, o = clone(S.defaults.params || d);
  if (!p || typeof p !== 'object') return o;
  const n = (v, lo, hi, dflt) => { v = Number(v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt; };
  if (typeof p.eq_break === 'boolean') o.eq_break = p.eq_break;
  if (typeof p.epa_cancel_on_lb === 'boolean') o.epa_cancel_on_lb = p.epa_cancel_on_lb;
  if (typeof p.epa_ipa_legs === 'boolean') o.epa_ipa_legs = p.epa_ipa_legs;
  if (['market', 'skip'].includes(p.epa_inzone)) o.epa_inzone = p.epa_inzone;
  if (p.epa_entry_rr != null) o.epa_entry_rr = n(p.epa_entry_rr, 0, 50, o.epa_entry_rr);
  if (p.max_per_day != null) o.max_per_day = Math.round(n(p.max_per_day, 0, 10, o.max_per_day));
  if (p.setups && typeof p.setups === 'object') for (const k of ['epa', 'ft_valid', 'ft_ipa']) if (typeof p.setups[k] === 'boolean') o.setups[k] = p.setups[k];
  if (['both', 'long', 'short'].includes(p.direction)) o.direction = p.direction;
  if (p.epa_entry != null) o.epa_entry = n(p.epa_entry, 0, 0.9, o.epa_entry);
  if (p.sl_buffer != null) o.sl_buffer = n(p.sl_buffer, 0, 5, o.sl_buffer);
  if (['structure', 'rr'].includes(p.tp_mode)) o.tp_mode = p.tp_mode;
  if (p.tp_rr != null) o.tp_rr = n(p.tp_rr, 0.1, 50, o.tp_rr);
  if (p.min_rr != null) o.min_rr = n(p.min_rr, 0, 50, o.min_rr);
  if (p.max_hold_hours != null) o.max_hold_hours = Math.round(n(p.max_hold_hours, 1, 24 * 365, o.max_hold_hours));
  // the only time filter is Bob's session in Paris time; the old UTC entry window is no longer exposed (backend defaults kept)
  if ('session_paris' in p) {
    const sp = p.session_paris;
    if (sp == null || (Array.isArray(sp) && sp.length === 2 && (sp[0] == null || sp[0] === '') && (sp[1] == null || sp[1] === ''))) o.session_paris = null;
    else if (Array.isArray(sp) && sp.length === 2) {
      const a = Math.round(n(sp[0], 0, 23, 14)), b = Math.round(n(sp[1], 1, 24, 17));
      if (a < b) o.session_paris = [a, b];
    }
  }
  if ('cost_bp' in p) o.cost_bp = p.cost_bp == null || p.cost_bp === '' ? null : n(p.cost_bp, 0, 1000, null);
  return o;
}
const canon = (p) => JSON.stringify(sanitizeParams(p), (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.fromEntries(Object.entries(v).sort()) : v);
const isDefault = () => canon(S.params) === canon(S.defaults.params);
function loadStored() {
  let p = null, a = null;
  try { p = JSON.parse(store.get('params')); } catch (e) {}
  try { a = JSON.parse(store.get('account')); } catch (e) {}
  S.params = sanitizeParams(p);
  S.draft = clone(S.params);
  const A = Object.assign({}, S.defaults.account || DEF_ACCOUNT);
  if (a && typeof a === 'object') {
    if (a.balance > 0) A.balance = Number(a.balance);
    if (['USD', 'EUR'].includes(a.currency)) A.currency = a.currency;
    if (a.risk_pct > 0 && a.risk_pct <= 10) A.risk_pct = Number(a.risk_pct);
  }
  S.account = A;
  const hz = store.get('hz2'); if (hz && (hz === 'perso' || HORIZONS.some((h) => h[0] === hz))) S.hz = hz;
  try { const c = JSON.parse(store.get('hzc')); if (c && typeof c === 'object') S.hzc = { start: c.start || '', end: c.end || '' }; } catch (e) {}
}
function saveParams() { store.set('params', JSON.stringify(S.params)); renderChip(); }
function renderChip() { $('modChip').hidden = isDefault(); }

/* ---------- chart ---------- */
const chart = LightweightCharts.createChart($('chart'), {
  autoSize: true,
  localization: { locale: 'fr-FR', timeFormatter: (t) => fmtD.format(new Date(t * 1000)) },
  timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 8,
    tickMarkFormatter: (t, type) => type <= 2 ? fmtTick.format(new Date(t * 1000)) : fmtHour.format(new Date(t * 1000)) },
  crosshair: { mode: 0 },
  handleScale: { axisPressedMouseMove: true }
});
/* while a trade is focused the price scale also covers its entry / SL / TP (plus room for the labels) */
const candles = chart.addCandlestickSeries({ borderVisible: false, priceLineVisible: true, autoscaleInfoProvider: (orig) => {
  const r = orig(), tr = S.selTr;
  if (!tr) return r;
  let lo = Math.min(tr.e, tr.sl, tr.tp), hi = Math.max(tr.e, tr.sl, tr.tp);
  if (r && r.priceRange) { lo = Math.min(lo, r.priceRange.minValue); hi = Math.max(hi, r.priceRange.maxValue); }
  return { priceRange: { minValue: lo, maxValue: hi }, margins: { above: 28, below: 28 } };
} });
const zig = chart.addLineSeries({ lineWidth: 2, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false });
let lines = [];
/* The zigzag is drawn by the overlay primitive (OV.zigzag), not by a line series: a line series holds one value per
   candle, and a candle often carries two structure points (bullish: low then high; bearish: high then low). */
function paintZig() { zig.setData([]); if (OV.req) OV.req(); }

function applyTheme() {
  const t = css('--text'), g = css('--grid'), b = css('--border'), up = css('--up'), dn = css('--down');
  chart.applyOptions({
    layout: { background: { type: 'solid', color: css('--bg') }, textColor: t, fontFamily: css('--font'), fontSize: 11 },
    grid: { vertLines: { color: g }, horzLines: { color: g } },
    rightPriceScale: { borderColor: b }, timeScale: { borderColor: b },
    crosshair: { vertLine: { color: css('--muted'), labelBackgroundColor: css('--muted') }, horzLine: { color: css('--muted'), labelBackgroundColor: css('--muted') } }
  });

  zig.applyOptions({ color: css('--down') });

}

/* ---------- overlay: positions (TradingView Long/Short style) + structure (series primitive) ---------- */
/* Everything is expressed in bar-index space (fractional index = between two bars, index >= n = future), converted to pixels at
   draw time with timeScale().logicalToCoordinate and series.priceToCoordinate, so it follows pan/zoom with no extra bookkeeping.
   Every position of the period is drawn (moderate opacity); the selected / hovered one is emphasised and gets the full labels. */
const hexA = (c, a) => { const m = /^#?([0-9a-f]{6})$/i.exec(c); if (!m) return c; const v = parseInt(m[1], 16); return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`; };
const fmtShort = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function tIdx(t) {
  const T = S.times, n = T ? T.length : 0;
  if (!n) return 0;
  if (t >= T[n - 1]) return n - 1 + (t - T[n - 1]) / 3600;
  if (t <= T[0]) return (t - T[0]) / 3600;
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= t) lo = m; else hi = m; }
  return lo + (t - T[lo]) / (T[lo + 1] - T[lo]);
}
const lotTxt = (l) => num(l, 2) + (l >= 2 ? ' lots' : ' lot');
const kindOf = (it) => it.k === 'FT' ? (it.v ? 'FT' : 'FT·IPA') : 'EPA';
const OV = {
  m: null, req: null, colors: null, hoverKey: null, hits: [],
  set(m) { this.m = m; if (this.req) this.req(); },
  attached(p) { this.req = p.requestUpdate; },
  detached() { this.req = null; },
  updateAllViews() {},
  paneViews() {
    return this.views || (this.views = ['bottom', 'top'].map((z) => ({
      zOrder: () => z,
      renderer: () => ({ draw: (target) => { try { OV.draw(target, z); } catch (e) { /* never break the chart */ } } })
    })));
  },
  col() {
    return this.colors || (this.colors = { up: css('--up'), dn: css('--down'), acc: css('--accent'), ft: '#9c27b0', epa: '#2962ff', mu: css('--muted'), warn: css('--warn'), font: css('--font') });
  },
  hit(x, y) {
    for (let i = this.hits.length - 1; i >= 0; i--) { const h = this.hits[i]; if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1) return h.it; }
    return null;
  },
  draw(target, layer) {
    const m = this.m; if (!m) return;
    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => this.paint(ctx, mediaSize.width, mediaSize.height, layer, m));
  },
  paint(ctx, w, h, layer, m) {
    const ts = chart.timeScale(), vr = ts.getVisibleLogicalRange(); if (!vr) return;
    const C = this.col(), bs = Math.max(1, (ts.logicalToCoordinate(1) ?? 1) - (ts.logicalToCoordinate(0) ?? 0));
    const X = (i) => { const x = ts.logicalToCoordinate(i); return x == null ? null : Math.max(-3000, Math.min(w + 3000, x)); };
    const Y = (p) => { const y = candles.priceToCoordinate(p); return y == null ? null : y; };
    const lo = vr.from - 3, hi = vr.to + 3, top = layer === 'top';
    ctx.save();
    if (!top) this.hits = [];
    // --- structure: fourchette band, EPA / IPA zones (subtle)
    for (const b of m.bands) {
      if (top) continue;
      const xa = X(b.i0), ya = Y(b.hi), yb = Y(b.lo); if (xa == null || ya == null || yb == null) continue;
      const x0 = Math.max(xa, 0);
      ctx.fillStyle = hexA(C.mu, 0.07); ctx.fillRect(x0, ya, w - x0, yb - ya);
    }
    for (const z of m.zones) {
      if ((z.i1 != null && z.i1 < lo) || z.i0 > hi) continue;
      const xa = X(z.i0), xb = z.i1 == null ? w : X(z.i1), ya = Y(z.hi), yb = Y(z.lo); if (xa == null || xb == null || ya == null || yb == null) continue;
      const c = z.ipa ? C.warn : C.acc, x0 = Math.max(xa, 0), x1 = Math.min(xb, w);
      if (x1 <= x0) continue;
      if (!top) { ctx.fillStyle = hexA(c, 0.08); ctx.fillRect(x0, ya, x1 - x0, yb - ya); continue; }
      ctx.strokeStyle = hexA(c, 0.5); ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
      ctx.strokeRect(x0 + 0.5, ya + 0.5, x1 - x0 - 1, yb - ya - 1); ctx.setLineDash([]);
      ctx.font = '600 10px ' + C.font; ctx.fillStyle = hexA(c, 0.95); ctx.textBaseline = 'alphabetic';
      ctx.fillText(w < 520 && z.ipa ? 'IPA' : z.label, x0 + 6, yb - ya > 16 ? ya + 12 : ya - 4);
    }
    if (top && S.show.struct) this.zigzag(ctx, X, Y, lo, hi, C, bs);
    if (top) {
      // --- BOS: dashed line from the broken point to the candle that broke it
      ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      for (const b of m.bos) {
        if (b.i1 < lo || b.i0 > hi) continue;
        const xa = X(b.i0), xb = X(b.i1), y = Y(b.y); if (xa == null || xb == null || y == null) continue;
        const yy = Math.round(y) + 0.5;
        ctx.strokeStyle = hexA(b.dir > 0 ? C.up : C.dn, 0.5); ctx.beginPath(); ctx.moveTo(xa, yy); ctx.lineTo(xb, yy); ctx.stroke();
      }

  if (key.startsWith('session_paris')) d.session_paris = Array.isArray(d.session_paris) ? d.session_paris : [null, null];
  if (key === 'cost_bp') d.cost_bp = v; else setPath(d, key, v);
  S.draft = d;   // not sanitised yet: validated on Apply
  if (key === 'epa_entry') $('epaOut').textContent = Math.round(v * 100) + ' %';
  if (key === 'tp_mode') $('p-tp_rr').disabled = v !== 'rr';
  if (key === 'epa_entry_rr') $('p-epa_entry').disabled = v != null && v > 0;
  $('frmState').innerHTML = frmState();
}
function validateDraft() {
  const d = S.draft, e = [];
  const isN = (x) => typeof x === 'number' && isFinite(x);
  if (!d.setups.epa && !d.setups.ft_valid && !d.setups.ft_ipa) e.push('Choisir au moins un type d\'entrée.');
  if (!isN(d.sl_buffer) || d.sl_buffer < 0) e.push('Marge SL : nombre positif ou nul.');
  if (d.tp_mode === 'rr' && (!isN(d.tp_rr) || d.tp_rr <= 0)) e.push('RR de l\'objectif : nombre supérieur à 0.');
  if (!isN(d.min_rr) || d.min_rr < 0) e.push('RR minimum : nombre positif ou nul.');
  if (!isN(d.epa_entry_rr) || d.epa_entry_rr < 0 || d.epa_entry_rr > 50) e.push('RR de l’ordre limite EPA : nombre entre 0 et 50.');
  if (!isN(d.max_per_day) || d.max_per_day < 0 || d.max_per_day > 10 || d.max_per_day % 1) e.push('Trades max par jour : entier entre 0 et 10.');
  if (!isN(d.max_hold_hours) || d.max_hold_hours < 1) e.push('Durée max : au moins 1 heure.');
  const sp = d.session_paris;
  if (Array.isArray(sp) && !(sp[0] == null && sp[1] == null) && !(isN(sp[0]) && isN(sp[1]) && sp[0] >= 0 && sp[1] <= 24 && sp[0] < sp[1] && sp[0] % 1 === 0 && sp[1] % 1 === 0)) e.push('Session : deux heures entières de Paris, début avant fin (ex. 14 → 17), ou les deux champs vides.');
  if (d.cost_bp != null && (!isN(d.cost_bp) || d.cost_bp < 0)) e.push('Frais : nombre positif ou nul (ou vide).');
  return e;
}
function applyParams(p, rerender) {
  S.params = p; S.draft = clone(p); S.frmErr = ''; saveParams();
  S.selKey = null; S.selTr = null; $('lgSel').textContent = '';
  S.frmMsg = 'Paramètres appliqués. Résultats dans <a href="#" data-act="goto" data-tab="stats">Statistiques</a> et <a href="#" data-act="goto" data-tab="trades">Trades</a>.';
  runBacktest(); loadPlan();
  if (S.data) loadChart({});   // the chart structure may depend on eq_break
  if (rerender) { renderPane('strat'); const b = document.querySelector('[data-act="reset"]'); if (b) b.focus(); }
  else $('frmState').innerHTML = frmState();
}

/* ---------- pane plumbing ---------- */
const TABS = ['plan', 'stats', 'trades', 'strat'];
function renderPane(only) {
  if (only && only !== S.tab) return;
  const pane = $('pane');
  const ae = document.activeElement;
  if (only && ae && (ae.id === 'hzStart' || ae.id === 'hzEnd')) {
    if (!S.pendingRender) { S.pendingRender = true; ae.addEventListener('blur', () => { S.pendingRender = false; renderPane(); }, { once: true }); }
    return;
  }
  const same = S.renderedTab === S.tab, top = pane.scrollTop;
  const refocus = ae && pane.contains(ae) && ae.dataset.acc ? `[data-acc="${ae.dataset.acc}"]` : null;
  if (S.eq) { S.eq.chart.remove(); S.eq = null; }
  pane.innerHTML = S.tab === 'plan' ? renderPlan() : S.tab === 'stats' ? renderStats() : S.tab === 'trades' ? renderTrades() : renderStrat();
  S.renderedTab = S.tab;
  if (same) pane.scrollTop = top; else pane.scrollTop = 0;
  TABS.forEach((t) => $('tab-' + t).setAttribute('aria-selected', S.tab === t));
  if (S.tab === 'stats') mountEq();
  if (refocus) { const e = pane.querySelector(refocus); if (e) e.focus(); }
}
function setTab(t) { S.tab = t; renderPane(); }
TABS.forEach((t) => $('tab-' + t).addEventListener('click', () => setTab(t)));
$('tabs').addEventListener('keydown', (e) => {
  const i = TABS.indexOf(S.tab); let n = -1;
  if (e.key === 'ArrowRight') n = (i + 1) % TABS.length; else if (e.key === 'ArrowLeft') n = (i + TABS.length - 1) % TABS.length;
  if (n >= 0) { setTab(TABS[n]); $('tab-' + TABS[n]).focus(); e.preventDefault(); }
});
$('modChip').addEventListener('click', () => setTab('strat'));
$('pane').addEventListener('toggle', (e) => { if (e.target.id === 'accDet') S.accOpen = e.target.open; }, true);

$('pane').addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-k]');
  if (t) { const tr = S.trMap.get(t.dataset.k); if (tr) focusTrade(tr); return; }
  const f = ev.target.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; S.tradeMax = 200; renderPane(); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'goto') { ev.preventDefault(); setTab(a.dataset.tab); }
  else if (act === 'retry-plan') loadPlan();
  else if (act === 'retry-bt') runBacktest();
  else if (act === 'more') { S.tradeMax += 300; renderPane(); }
  else if (act === 'hz') {
    const k = a.dataset.hz;
    if (k === 'perso') { S.hzOpen = true; S.hz = 'perso'; store.set('hz2', 'perso'); renderHz(); renderPane(); if (S.hzc.start || S.hzc.end) runBacktest(); return; }
    S.hz = k; S.hzOpen = false; store.set('hz2', k); renderHz(); renderPane(); runBacktest();
  }
  else if (act === 'hz-apply') {
    const s = $('hzStart').value, e = $('hzEnd').value;
    if (s && e && s > e) { $('hzErr').textContent = 'La date de début doit précéder la date de fin.'; return; }
    S.hzc = { start: s, end: e }; S.hz = 'perso'; store.set('hz2', 'perso'); renderHz(); store.set('hzc', JSON.stringify(S.hzc)); runBacktest();
  }
  else if (act === 'apply') {
    const errs = validateDraft();
    if (errs.length) { S.frmErr = errs.map(esc).join('<br>'); $('frmState').innerHTML = frmState(); return; }
    applyParams(sanitizeParams(S.draft));
  }
  else if (act === 'reset') {
    S.defaults.params = S.defaults.params || DEF_PARAMS;
    applyParams(sanitizeParams(clone(S.defaults.params)), true);
  }
  else if (act === 'copy') {
    const o = (S.orders || [])[+a.dataset.oi]; if (!o) return;
    const ok = await copyText(orderText(o));
    a.textContent = ok ? 'Copié ✓' : 'Copie impossible'; setTimeout(() => { a.textContent = 'Copier'; }, 1800);
  }
});
$('pane').addEventListener('input', (ev) => { if (ev.target.dataset.p) onFormInput(ev.target); });
$('pane').addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.p) { onFormInput(el); return; }
  if (el.dataset.acc) {
    const k = el.dataset.acc, A = Object.assign({}, S.account);
    let v = k === 'currency' ? el.value : parseFloat(el.value), err = '';
    if (k === 'balance' && !(v > 0)) err = 'Capital : nombre supérieur à 0.';
    if (k === 'risk_pct' && !(v > 0 && v <= 10)) err = 'Risque : entre 0,01 et 10 %.';
    if (err) { $('accErr').textContent = err; el.value = A[k]; return; }
    $('accErr').textContent = ''; A[k] = v; S.account = A; store.set('account', JSON.stringify(A));
    later('acc', () => loadPlan(), 400);
  }
});
setInterval(() => {
  const e = $('delay'); if (!e || S.tab !== 'plan') return;
  const d = (+e.dataset.delay || 0) + (Date.now() - +e.dataset.at) / 1000;
  e.textContent = `données à jour au ${fmtT(+e.dataset.asof)} (${ago(d)})`; e.classList.toggle('warnc', d > 3 * 3600);
  const px = $('planPx'); if (px && S.px[S.id] != null) px.textContent = num(S.px[S.id], S.data ? S.data.dec : 2);
}, 15000);

/* ---------- toolbar ---------- */
function renderMenu() {
  const m = $('menu');
  m.innerHTML = S.ins.map((x) => {
    const st = S.status && S.status.inst[x.id], boot = (st && !st.ready) || x.ready === false;
    const px = boot ? `<em class="dl">${st && st.progress != null ? Math.round(st.progress * 100) + ' %' : 'téléchargement'}</em>` : `<em data-px="${x.id}">${S.px[x.id] != null ? num(S.px[x.id], x.dec) : ''}</em>`;
    return `<button role="option" data-id="${x.id}" aria-current="${x.id === S.id}"><b>${x.id}</b><span>${esc(x.label)}</span>${px}</button>`;
  }).join('') + (S.insErr ? `<div class="menu-err">Liste des marchés non mise à jour (${esc(S.insErr)}). Nouvelle tentative en cours.</div>` : '');
}
function setMenu(open) { $('menu').hidden = !open; $('symBtn').setAttribute('aria-expanded', open); if (open) { const c = $('menu').querySelector('[aria-current="true"]'); if (c) c.focus(); } }
$('symBtn').addEventListener('click', (e) => { e.stopPropagation(); setMenu($('menu').hidden); });
$('menu').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (!b) return; setMenu(false); $('symBtn').focus(); if (b.dataset.id !== S.id) load(b.dataset.id); });
$('menu').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const bs = [...$('menu').querySelectorAll('button')], i = bs.indexOf(document.activeElement);
  bs[(i + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus(); e.preventDefault();
});
document.addEventListener('click', () => setMenu(false));
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const wasOpen = !$('menu').hidden; setMenu(false);
  if (wasOpen) { $('symBtn').focus(); return; }
  exitFocus();
});
function toggle(btn, key) {
  $(btn).addEventListener('click', () => {
    S.show[key] = !S.show[key]; $(btn).setAttribute('aria-pressed', S.show[key]);
    if (key === 'struct') { paintZig(); drawLines(); }
    drawMarkers();
  });
}
toggle('tStruct', 'struct'); toggle('tEpa', 'epa'); toggle('tFt', 'ft');
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function renderTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('tTheme').innerHTML = dark ? SUN : MOON;
  $('tTheme').title = dark ? 'Passer en thème clair' : 'Passer en thème sombre';
  $('tTheme').setAttribute('aria-label', $('tTheme').title);
}
$('tTheme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; store.set('theme', t); renderTheme();
});
renderTheme();
function renderHz() {
  $('hzBar').innerHTML = HORIZONS.map(([k, l]) => `<button aria-pressed="${S.hz === k}" data-hzc="${k}">${l}</button>`).join('') + `<button aria-pressed="${S.hz === 'perso'}" data-hzc="perso" title="Dates au choix (onglet Statistiques)">Perso</button>`;
}
$('hzBar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-hzc]'); if (!b) return;
  const k = b.dataset.hzc; S.hz = k; S.hzOpen = k === 'perso'; store.set('hz2', k); renderHz();
  if (k === 'perso') { setTab('stats'); if (S.hzc.start || S.hzc.end) runBacktest(); return; }
  renderPane(); runBacktest();
});

/* ---------- start ---------- */
async function loadInstruments() {
  try {
    const L = await api('instruments');
    if (Array.isArray(L) && L.length) {
      S.ins = L.map((x) => ({ id: x.id, label: x.label || x.id, dec: x.dec != null ? x.dec : decOf(x.id), cost_bp: x.cost_bp, ready: x.ready !== false }));
      for (const x of L) if (x.last_tick && x.last_tick.bid != null && S.px[x.id] == null) S.px[x.id] = x.last_tick.bid;
      S.insOk = true; S.insErr = '';
      const c = curIns(); $('symLabel').textContent = c.label; renderMenu(); renderDataEnd();
      if (S.tab === 'strat') renderStratPlaceholders();
      return;
    }
  } catch (e) { S.insErr = e.message; renderMenu(); }
  later('ins', loadInstruments, 8000);
}
function renderStratPlaceholders() { const e = $('p-cost_bp'); if (e) { const c = curIns(); e.placeholder = c.cost_bp != null ? 'défaut ' + String(c.cost_bp).replace('.', ',') : 'défaut'; } }
async function loadDefaults() {
  try {
    const D = await api('defaults');
    if (D && D.params) {
      S.defaults = { params: Object.assign(clone(DEF_PARAMS), D.params), account: Object.assign({}, DEF_ACCOUNT, D.account || {}) };
      S.defOk = true;
      return true;
    }
  } catch (e) { /* fallback to built-in Bob's rules, retried below */ }
  return false;
}
(async function init() {
  const ok = await loadDefaults();
  loadStored(); renderHz();
  if (!ok) (function retry() { later('def', async () => { if (await loadDefaults()) { renderChip(); if (S.tab === 'strat') renderPane(); } else retry(); }, 10000); })();
  renderChip(); renderMenu(); renderPill();
  const h = (location.hash || '').slice(1).toUpperCase();
  const known = (id) => S.ins.some((x) => x.id === id);
  loadInstruments(); connect(); refreshStatus();
  setInterval(refreshStatus, 60000);
  load(known(h) ? h : (known(store.get('pair')) ? store.get('pair') : 'XAUUSD'));
})();
</script>
