server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types application/json application/javascript text/css;

    # Docker DNS; the upstream is resolved at request time so nginx starts even if the api is not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }   # page updates show up on reload
    location /data/ { add_header Cache-Control "no-cache"; }

    # Server-Sent Events: no buffering, long read timeout
    location = /api/stream {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
        add_header Cache-Control "no-store";
    }
}
